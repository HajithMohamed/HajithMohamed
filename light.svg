<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Gradient for Light Mode -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="card-grad-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Pattern for grid overlay -->
    <pattern id="circuit-grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="340" fill="url(#bg-grad-light)"/>

  <!-- Grid Pattern Overlay -->
  <rect width="1200" height="340" fill="url(#circuit-grid-light)"/>

  <!-- Top / Bottom Accent Lines -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accent-light)" stroke-width="3"/>
  <line x1="0" y1="339" x2="1200" y2="339" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Circuit Trace Lines & Tech Accent Dots -->
  <path d="M 80 40 L 160 40 L 180 60 L 320 60" fill="none" stroke="#0284C7" stroke-width="1.2" opacity="0.3"/>
  <circle cx="180" cy="60" r="2.5" fill="#0284C7"/>
  <path d="M 1120 40 L 1040 40 L 1020 60 L 880 60" fill="none" stroke="#4F46E5" stroke-width="1.2" opacity="0.3"/>
  <circle cx="1020" cy="60" r="2.5" fill="#4F46E5"/>

  <!-- Corner Brackets -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.6"/>
  <path d="M 1176 40 L 1176 24 L 1160 24" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.6"/>
  <path d="M 24 300 L 24 316 L 40 316" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.6"/>
  <path d="M 1176 300 L 1176 316 L 1160 316" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.6"/>

  <!-- Main Content Centered -->
  <g text-anchor="middle" id="hero-content">
    
    <!-- Status Eyebrow Badge -->
    <g transform="translate(600, 52)">
      <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="-216" cy="0" r="4.5" fill="#10B981"/>
      <text x="10" y="4.5" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.5">
        BICT (HONS) UNDERGRADUATE &bull; UNIVERSITY OF RUHUNA
      </text>
    </g>

    <!-- Main Headline Name -->
    <text x="600" y="132" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Mohamed Hajith
    </text>

    <!-- Subtitle -->
    <text x="600" y="174" fill="url(#accent-light)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">
      Full-Stack Software Developer | Backend &amp; Database Engineering
    </text>

    <!-- Brief Focus Statement -->
    <text x="600" y="210" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">
      Building practical web applications, secure REST APIs, and database-driven business systems.
    </text>

    <!-- 5 Core Competency Pills in Row -->
    <g transform="translate(600, 264)">
      <!-- Pill 1: Next.js & React -->
      <g transform="translate(-360, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="url(#card-grad-light)" stroke="#CBD5E1" stroke-width="1"/>
        <text x="0" y="4.5" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Next.js &amp; React</text>
      </g>
      <!-- Pill 2: Node & NestJS -->
      <g transform="translate(-180, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="url(#card-grad-light)" stroke="#CBD5E1" stroke-width="1"/>
        <text x="0" y="4.5" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Node &amp; NestJS</text>
      </g>
      <!-- Pill 3: PostgreSQL & Prisma -->
      <g transform="translate(0, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="8" fill="url(#card-grad-light)" stroke="#0284C7" stroke-width="1"/>
        <text x="0" y="4.5" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">PostgreSQL &amp; Prisma</text>
      </g>
      <!-- Pill 4: Docker & Azure -->
      <g transform="translate(180, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="url(#card-grad-light)" stroke="#CBD5E1" stroke-width="1"/>
        <text x="0" y="4.5" fill="#4F46E5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Docker &amp; Azure</text>
      </g>
      <!-- Pill 5: REST APIs & CI/CD -->
      <g transform="translate(360, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="url(#card-grad-light)" stroke="#CBD5E1" stroke-width="1"/>
        <text x="0" y="4.5" fill="#0D9488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">REST APIs &amp; CI/CD</text>
      </g>
    </g>

  </g>
</svg>
