name: Update profile banner

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-banner.mjs"
      - ".github/workflows/update-banner.yml"

permissions:
  contents: write

concurrency:
  group: profile-banner
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate banners from live GitHub data
        run: node scripts/generate-banner.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- dark.svg light.svg)" ]; then
            echo "Banner unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          git commit -m "chore: refresh profile banner"
          git push
