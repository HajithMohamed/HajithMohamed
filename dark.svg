<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="50%" stop-color="#090E24"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Filter for soft neon blur -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Pattern for grid overlay -->
    <pattern id="circuit-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="340" fill="url(#bg-grad)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="80" r="140" fill="#6366F1" opacity="0.18" filter="url(#neon-glow)"/>
  <circle cx="1020" cy="220" r="160" fill="#2DD4BF" opacity="0.14" filter="url(#neon-glow)"/>
  <circle cx="600" cy="170" r="220" fill="url(#glow-grad)"/>

  <!-- Grid Pattern Overlay -->
  <rect width="1200" height="340" fill="url(#circuit-grid)"/>

  <!-- Top / Bottom Accent Cybernetic Laser Lines -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.8"/>
  <line x1="0" y1="339" x2="1200" y2="339" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Circuit Trace Lines & Tech Accent Dots -->
  <path d="M 80 40 L 160 40 L 180 60 L 320 60" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.4"/>
  <circle cx="180" cy="60" r="2.5" fill="#38BDF8"/>
  <path d="M 1120 40 L 1040 40 L 1020 60 L 880 60" fill="none" stroke="#6366F1" stroke-width="1.2" opacity="0.4"/>
  <circle cx="1020" cy="60" r="2.5" fill="#6366F1"/>
  <path d="M 120 300 L 220 300 L 240 280 L 400 280" fill="none" stroke="#2DD4BF" stroke-width="1" opacity="0.3"/>
  <circle cx="240" cy="280" r="2" fill="#2DD4BF"/>

  <!-- Corner Brackets -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
  <path d="M 1176 40 L 1176 24 L 1160 24" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
  <path d="M 24 300 L 24 316 L 40 316" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
  <path d="M 1176 300 L 1176 316 L 1160 316" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>

  <!-- Main Content Centered -->
  <g text-anchor="middle" id="hero-content">
    
    <!-- Status Eyebrow Badge -->
    <g transform="translate(600, 52)">
      <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#0A1128" stroke="#1E293B" stroke-width="1"/>
      <circle cx="-216" cy="0" r="4.5" fill="#10B981"/>
      <circle cx="-216" cy="0" r="8" fill="#10B981" opacity="0.3"/>
      <text x="10" y="4.5" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.5">
        BICT (HONS) UNDERGRADUATE &bull; UNIVERSITY OF RUHUNA
      </text>
    </g>

    <!-- Main Headline Name -->
    <text x="600" y="132" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Mohamed Hajith
    </text>

    <!-- Subtitle with Glowing Radiant Gradient -->
    <text x="600" y="174" fill="url(#accent-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">
      Full-Stack Software Developer | Backend &amp; Database Engineering
    </text>

    <!-- Brief Focus Statement -->
    <text x="600" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">
      Building practical web applications, secure REST APIs, and database-driven business systems.
    </text>

    <!-- 5 Core Competency Pills in Row -->
    <g transform="translate(600, 264)">
      <!-- Pill 1: Next.js & React -->
      <g transform="translate(-360, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4.5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Next.js &amp; React</text>
      </g>
      <!-- Pill 2: Node & Express -->
      <g transform="translate(-180, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4.5" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Node &amp; NestJS</text>
      </g>
      <!-- Pill 3: PostgreSQL & MySQL -->
      <g transform="translate(0, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="8" fill="url(#card-grad)" stroke="#0284C7" stroke-width="1"/>
        <text x="0" y="4.5" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">PostgreSQL &amp; Prisma</text>
      </g>
      <!-- Pill 4: Docker & Azure -->
      <g transform="translate(180, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4.5" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Docker &amp; Azure</text>
      </g>
      <!-- Pill 5: REST APIs & CI/CD -->
      <g transform="translate(360, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4.5" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">REST APIs &amp; CI/CD</text>
      </g>
    </g>

  </g>
</svg>
